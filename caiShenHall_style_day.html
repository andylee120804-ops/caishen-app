<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>财神殿 · 风格一 朱红昼殿</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px 12px;
    background: radial-gradient(circle at 50% 0%, #2a1418, #100a0c 70%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fdf6e3;
  }
  .tip { font-size: 12px; color: rgba(255,209,0,.75); max-width: 420px; text-align: center; line-height: 1.7; }
  .tip b { color: #ffd700; }

  /* ── 手机框 ── */
  .phone {
    position: relative; width: 390px; height: 844px; border-radius: 44px;
    overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 10px #1c1014;
    background: #4b0c12;
  }

  /* ── 殿宇背景：与 App 首页完全同源的朱红渐变 + 顶部金色光晕 ── */
  .hall {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #880e1f 0%, #720f18 55%, #4b0c12 100%);
  }
  .halo {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 12%, rgba(255,209,0,.38), rgba(255,209,0,0) 58%);
  }
  /* 点灯后全殿加一层暖光 */
  .warm {
    position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1s;
    background: radial-gradient(circle at 50% 62%, rgba(255,200,80,.12), rgba(255,200,80,0) 55%);
  }
  .phone.lit .warm { opacity: 1; }

  /* 金色光尘（漂浮） */
  .dust { position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(255,220,120,.85); box-shadow: 0 0 6px 2px rgba(255,220,120,.4);
    animation: dustFloat 7s linear infinite; pointer-events: none; }
  .dust.d1 { left: 88px; top: 560px; } .dust.d2 { left: 300px; top: 600px; animation-delay: 3.2s; }
  @keyframes dustFloat {
    0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; }
    85% { opacity: .6; } 100% { transform: translateY(-90px); opacity: 0; }
  }

  /* ── 檐枋 + 斗拱 + 流苏 ── */
  .beam {
    position: absolute; top: 118px; left: 0; right: 0; height: 34px;
    background: linear-gradient(180deg, #5a0f16, #420c12);
    border-top: 1.5px solid rgba(255,209,0,.55);
    border-bottom: 1.5px solid rgba(255,209,0,.4);
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  .dougong {
    position: absolute; top: 152px; left: 0; right: 0; height: 7px;
    background: repeating-linear-gradient(90deg, rgba(255,209,0,.5) 0 5px, transparent 5px 26px);
    opacity: .8;
  }
  .tassel { position: absolute; top: 152px; width: 2px; height: 34px;
    background: linear-gradient(180deg, rgba(255,209,0,.75), rgba(255,209,0,.15)); }
  .tassel.t1 { left: 66px; } .tassel.t2 { right: 66px; }

  /* ── 匾额 ── */
  .plaque {
    position: absolute; top: 92px; left: 50%; transform: translateX(-50%);
    width: 158px; height: 48px; border-radius: 8px; z-index: 4;
    background: linear-gradient(180deg, #5a0f16, #3c0a10);
    border: 1.5px solid rgba(255,209,0,.55);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #ffd700; letter-spacing: 8px; text-indent: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.45), inset 0 0 12px rgba(255,209,0,.08);
  }
  /* 匾额铆钉 */
  .plaque::before, .plaque::after {
    content: ''; position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    background: #ffd700; transform: translateY(-50%); box-shadow: 0 0 6px rgba(255,209,0,.8);
  }
  .plaque::before { left: 9px; } .plaque::after { right: 9px; }

  /* ── 殿柱（朱红 + 金箍） ── */
  .pillar {
    position: absolute; top: 159px; width: 18px; height: 520px; border-radius: 8px;
    background: linear-gradient(90deg, #3c0a10, #6b1120 45%, #6b1120 55%, #3c0a10);
    border: 1px solid rgba(255,209,0,.35);
  }
  .pillar::after {
    content: ''; position: absolute; inset: 0; border-radius: 8px;
    background: repeating-linear-gradient(180deg, transparent 0 140px, rgba(255,209,0,.5) 140px 143px);
  }
  .pillar.left { left: 40px; } .pillar.right { right: 40px; }

  /* ── 地面 ── */
  .floor {
    position: absolute; left: 0; right: 0; bottom: 84px; height: 150px;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(26,10,6,.55));
  }
  .ground-shadow { position: absolute; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(10,4,2,.5), rgba(10,4,2,0) 70%); pointer-events: none; }

  /* ── 顶部栏 ── */
  .topbar { position: absolute; top: 0; left: 0; right: 0; padding: 52px 16px 8px;
    display: flex; align-items: center; z-index: 6; }
  .topbar .title { font-size: 20px; font-weight: 700; color: #ffd700; flex: 1; letter-spacing: 2px; }
  .decor-btn { font-size: 13px; color: #ffd700; padding: 6px 12px;
    border: 1px solid rgba(255,209,0,.4); border-radius: 16px; cursor: pointer; }

  /* ── 财神像（真实素材 deities/1.png） ── */
  .deity-glow { position: absolute; top: 130px; left: 50%; transform: translateX(-50%);
    width: 320px; height: 320px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,209,0,.42), rgba(255,209,0,0) 62%);
    animation: breath 4.5s ease-in-out infinite; }
  @keyframes breath { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
  .deity { position: absolute; top: 168px; left: 50%; transform: translateX(-50%);
    width: 192px; height: 192px; object-fit: contain; cursor: pointer;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.45)); transition: transform .2s; z-index: 3; }
  .deity:active { transform: translateX(-50%) scale(.97); }
  .deity-hint { position: absolute; top: 372px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,209,0,.6); font-style: italic; white-space: nowrap; }

  /* ── 长明灯（宫灯） ── */
  .lamp { position: absolute; top: 452px; left: 52px; width: 104px;
    text-align: center; cursor: pointer; z-index: 3; }
  .lamp-glow { position: absolute; top: -36px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 150px; border-radius: 50%; background: #ffd700;
    opacity: 0; filter: blur(22px); transition: opacity .5s; pointer-events: none; }
  .lamp-hook { width: 2px; height: 14px; margin: 0 auto;
    background: linear-gradient(180deg, rgba(255,209,0,.15), rgba(255,209,0,.7)); }
  .lamp-top { width: 30px; height: 8px; margin: 0 auto; border-radius: 4px 4px 2px 2px;
    background: linear-gradient(180deg, #e8bd55, #b8862e); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .lamp-body { position: relative; width: 48px; height: 58px; margin: 0 auto; border-radius: 12px;
    background: radial-gradient(circle at 50% 42%, #e0514a, #c0392b 70%, #96261c);
    border: 1px solid rgba(255,209,0,.5); box-shadow: 0 4px 10px rgba(0,0,0,.35);
    overflow: hidden; }
  .lamp-ribs { position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,214,90,.5) 0 1.5px, transparent 1.5px 9px); }
  .lamp-fire { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 18px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: #7a6a3a; opacity: .75; transition: all .4s; }
  .lamp-bottom { width: 30px; height: 7px; margin: 0 auto; border-radius: 2px 2px 4px 4px;
    background: linear-gradient(180deg, #b8862e, #8a6322); }
  .lamp-tassel { width: 2.5px; height: 24px; margin: 2px auto 0;
    background: linear-gradient(180deg, #e0514a, rgba(224,81,74,.15)); border-radius: 2px; }
  .lamp.lit .lamp-glow { opacity: .9; }
  .lamp.lit .lamp-fire { background: #fff3b0; opacity: 1;
    box-shadow: 0 0 14px 4px rgba(255,220,120,.85); }
  .lamp .label { margin-top: 8px; font-size: 11px; color: rgba(253,246,227,.8); }
  .ground-shadow.gs-lamp { top: 648px; left: 62px; width: 84px; height: 20px; }

  /* ── 香炉（真实素材 incense_burner.png） ── */
  .censer { position: absolute; top: 452px; right: 52px; width: 104px;
    text-align: center; cursor: pointer; z-index: 3; }
  .smokebox { position: relative; width: 104px; height: 92px; }
  .stickwrap { position: absolute; left: 50%; bottom: 2px; width: 4px; height: 48px;
    transform: translateX(-50%); opacity: 0; }
  .stickwrap .stick { position: absolute; bottom: 0; left: 0; width: 4px; height: 48px;
    border-radius: 2px; background: linear-gradient(180deg, #e8d9b5, #c9b489);
    transition: height 2.3s linear; }
  .stickwrap .ember { position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle, #ffd27a, #ff6a2a 60%, #b3341c);
    box-shadow: 0 0 8px 2px rgba(255,120,40,.8); opacity: 0; transition: opacity .3s; }
  .stickwrap.burning .stick { height: 16px; }
  .stickwrap.burning .ember { opacity: 1; }
  .smoke { position: absolute; left: 50%; top: 0; width: 10px; height: 10px; border-radius: 50%;
    background: #fff; filter: blur(3px); opacity: 0; }
  .censer.smoking .s1 { animation: smokeUp 2s linear infinite; }
  .censer.smoking .s2 { animation: smokeUp 2s linear .55s infinite; }
  .censer.smoking .s3 { animation: smokeUp 2s linear 1.1s infinite; }
  @keyframes smokeUp {
    0% { transform: translate(-50%, 0) scale(.5); opacity: 0; }
    25% { opacity: .5; }
    100% { transform: translate(-46%, -110px) scale(1.8); opacity: 0; }
  }
  .burner-img { width: 92px; height: 80px; object-fit: contain; margin-top: -8px;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.4)); }
  .censer .label { margin-top: 8px; font-size: 11px; color: rgba(253,246,227,.8); }
  .ground-shadow.gs-censer { top: 646px; right: 60px; width: 90px; height: 20px; }

  @keyframes stickDrop {
    0% { transform: translate(-50%, -52px); opacity: 0; }
    55% { opacity: 1; }
    100% { transform: translate(-50%, 0); opacity: 1; }
  }

  /* ── 飘字 ── */
  .fly { position: absolute; top: 252px; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 700; color: #ffd100; opacity: 0;
    pointer-events: none; z-index: 8; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  @keyframes flyUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -120px); }
  }
  .fly.show { animation: flyUp 1.1s ease-out forwards; }

  /* ── 底部信息条 ── */
  .infobar { position: absolute; bottom: 96px; left: 0; right: 0;
    padding: 14px 16px 10px; display: flex; z-index: 6;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(30,10,8,.35)); }
  .infocell { flex: 1; text-align: center; }
  .infocell .v { font-size: 18px; font-weight: 700; color: #ffd100; }
  .infocell .k { font-size: 11px; color: rgba(253,246,227,.65); margin-top: 2px; }

  /* ── Tab 栏（复刻 App：#4B0C12 底 / 金图标 / 激活金标） ── */
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 84px;
    background: #4b0c12; display: flex; z-index: 7;
    box-shadow: 0 -2px 12px rgba(0,0,0,.3); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 8px 0 32px; cursor: pointer; }
  .tab.active { background: rgba(255,209,0,.08); }
  .tab .ic { height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1; }
  .tab .ic img { width: 22px; height: 22px; object-fit: contain; }
  .tab .lb { font-size: 10px; margin-top: 3px; color: rgba(253,246,227,.5); max-width: 64px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.active .lb { color: #ffd700; }

  /* ── Toast ── */
  .toast { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #ffd700; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; z-index: 30; white-space: nowrap; opacity: 0; transition: opacity .3s;
    pointer-events: none; }
</style>
</head>
<body>
  <div class="tip">
    📱 <b>风格一 · 朱红昼殿</b> —— 与 App 首页完全同源的朱红金渐变，喜庆明亮<br/>
    点击 <b>长明灯 / 香炉 / 财神像</b> 体验 · 素材为项目真实图（轮值主神示例：王亥）<br/>
    <span style="color:rgba(253,246,227,.55)">灯与香为免费界面互动，不售卖任何供奉类虚拟物品</span>
  </div>

  <div class="phone" id="phone">
    <div class="hall"></div>
    <div class="halo"></div>
    <div class="warm"></div>
    <div class="dust d1"></div><div class="dust d2"></div>

    <!-- 殿宇结构 -->
    <div class="floor"></div>
    <div class="pillar left"></div><div class="pillar right"></div>
    <div class="beam"></div>
    <div class="dougong"></div>
    <div class="tassel t1"></div><div class="tassel t2"></div>
    <div class="plaque">財神殿</div>

    <!-- 顶部栏 -->
    <div class="topbar">
      <div class="title">財神殿</div>
      <div class="decor-btn" onclick="toast('装扮选择弹窗沿用主预览稿体验')">🎨 装扮</div>
    </div>

    <!-- 财神像 -->
    <div class="deity-glow"></div>
    <img class="deity" src="entry/src/main/resources/rawfile/deities/1.png" alt="财神像" draggable="false" onclick="onDeity()" />
    <div class="deity-hint">点击财神 · 写下今日心愿</div>
    <div class="ground-shadow" style="top:392px; left:50%; transform:translateX(-50%); width:230px; height:36px;"></div>

    <!-- 长明灯 -->
    <div class="ground-shadow gs-lamp"></div>
    <div class="lamp" id="lamp" onclick="onLamp()">
      <div class="lamp-glow"></div>
      <div class="lamp-hook"></div>
      <div class="lamp-top"></div>
      <div class="lamp-body"><div class="lamp-ribs"></div><div class="lamp-fire"></div></div>
      <div class="lamp-bottom"></div>
      <div class="lamp-tassel"></div>
      <div class="label" id="lampLabel">点亮长明灯</div>
    </div>

    <!-- 香炉 -->
    <div class="ground-shadow gs-censer"></div>
    <div class="censer" id="censer" onclick="onCenser()">
      <div class="smokebox">
        <div class="stickwrap" id="stickwrap">
          <div class="stick"><div class="ember"></div></div>
        </div>
        <div class="smoke s1"></div><div class="smoke s2"></div><div class="smoke s3"></div>
        <img class="burner-img" src="entry/src/main/resources/rawfile/props/incense_burner.png" alt="香炉" draggable="false" />
      </div>
      <div class="label" id="censerLabel">上一炷香</div>
    </div>

    <div class="fly" id="fly"></div>

    <!-- 底部信息条 -->
    <div class="infobar">
      <div class="infocell"><div class="v" id="heartV">5</div><div class="k">心意值</div></div>
      <div class="infocell"><div class="v" id="stickV">0 支</div><div class="k">今日上香</div></div>
      <div class="infocell"><div class="v" id="streakV">0 天</div><div class="k">连续点亮</div></div>
    </div>

    <!-- Tab 栏 -->
    <div class="tabbar">
      <div class="tab"><div class="ic"><img src="entry/src/main/resources/rawfile/props/yuanbao.png" alt="" /></div><div class="lb">祈福</div></div>
      <div class="tab active">
        <div class="ic">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path fill="#FFD700" d="M12 2.4 C9.2 4.7 5.5 6.4 2.5 7.2 L2.5 9.5 C6.3 8.7 9.6 7.2 12 5.4 C14.4 7.2 17.7 8.7 21.5 9.5 L21.5 7.2 C18.5 6.4 14.8 4.7 12 2.4 Z"/>
            <path fill="#FFD700" d="M4.4 10.7 L19.6 10.7 L19.6 17.8 L16.9 17.8 L16.9 13.1 L13.6 13.1 L13.6 17.8 L10.4 17.8 L10.4 13.1 L7.1 13.1 L7.1 17.8 L4.4 17.8 Z"/>
            <path fill="#FFD700" d="M3 18.9 L21 18.9 L21 20.7 L3 20.7 Z"/>
          </svg>
        </div>
        <div class="lb">财神殿</div>
      </div>
      <div class="tab"><div class="ic">🙏</div><div class="lb">还愿</div></div>
      <div class="tab"><div class="ic">🎋</div><div class="lb">求签</div></div>
      <div class="tab"><div class="ic">🧧</div><div class="lb">我的</div></div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  const state = { heart: 5, lampLit: false, sticks: 0, streak: 0 };
  const $ = id => document.getElementById(id);

  function render() {
    $('heartV').textContent = state.heart;
    $('stickV').textContent = state.sticks + ' 支';
    $('streakV').textContent = state.streak + ' 天';
    $('lampLabel').textContent = state.lampLit ? '长明灯亮' : '点亮长明灯';
    $('lamp').classList.toggle('lit', state.lampLit);
    $('phone').classList.toggle('lit', state.lampLit);
  }

  // ── 点灯（−2 心意值，点亮至次日 0 点）──
  function onLamp() {
    if (state.lampLit) { toast('今日长明灯已点亮'); return; }
    if (state.heart < 2) { toast('心意值不足 · 每日进殿可得心意值'); return; }
    state.heart -= 2; state.lampLit = true; state.streak += 1;
    render(); fly('长明灯亮'); toast('长明灯将亮至次日零点 · 陪伴一整日');
  }

  // ── 上香（−3 心意值，燃烧完成回 +1 静心）──
  let burning = false;
  function onCenser() {
    if (burning) return;
    if (state.heart < 3) { toast('心意值不足 · 每日进殿可得心意值'); return; }
    burning = true; state.heart -= 3; render();
    const w = $('stickwrap');
    w.style.animation = 'stickDrop .32s ease-out forwards';
    setTimeout(() => {
      w.classList.add('burning');
      $('censer').classList.add('smoking');
    }, 340);
    setTimeout(() => {
      state.sticks += 1; state.heart += 1; burning = false;
      w.classList.remove('burning'); w.style.animation = ''; w.style.opacity = 0;
      $('censer').classList.remove('smoking');
      render(); fly('静心一刻');
    }, 2800);
  }

  // ── 财神像：写心愿入口 ──
  function onDeity() { toast('心诚则灵 · 写下今日心愿（走心愿墙）'); }

  // ── 飘字 ──
  function fly(t) {
    const f = $('fly'); f.textContent = t;
    f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; }, 2200);
  }

  render();
</script>
</body>
</html>
