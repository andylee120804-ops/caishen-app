<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祈福进香阶段 · 方案对比 v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #171208; color: #fdf6e3;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 26px; display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 18px; color: #FFD700; font-weight: bold; margin-bottom: 4px; }
  .sub { font-size: 12.5px; color: rgba(253,246,227,0.62); margin-bottom: 20px; text-align: center; max-width: 980px; line-height: 1.7; }
  .row { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .tag { font-size: 13px; font-weight: bold; margin-bottom: 10px; padding: 4px 16px; border-radius: 20px; }
  .tag.a { color: #fff; background: #e74c3c; }
  .tag.b { color: #1a1a0a; background: #2ecc71; }
  .tag.c { color: #1a1a0a; background: #f9ca24; }
  .phone {
    width: 390px; height: 844px; border-radius: 36px; overflow: hidden;
    position: relative; box-shadow: 0 14px 44px rgba(0,0,0,0.65);
    background: linear-gradient(180deg, #D23B2E 0%, #A51D16 55%, #6F120E 100%);
  }
  .glow { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(58% 58% at 50% 12%, rgba(255,209,0,0.40) 0%, rgba(255,209,0,0) 100%); }
  .deity-array { position: absolute; left: 0; width: 100%; height: 50%; }
  .deity { position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; }
  .deity .halo { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    border-radius: 50%; }
  .deity .iconwrap { position: relative; display: flex; align-items: center; justify-content: center; }
  .deity .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; }
  .deity img { display: block; object-fit: contain; }
  .deity .name { font-weight: bold; color: #FFD700; margin-top: 8px; white-space: nowrap; }
  .deity .direction { font-size: 10px; color: rgba(255,209,0,0.6); margin-top: 4px; white-space: nowrap; }
  .deity .meaning { font-size: 10px; color: rgba(253,246,227,0.5); margin-top: 2px;
    line-height: 15px; text-align: center; white-space: pre-line; }
  .incense { position: absolute; left: 50%; top: 70%; transform: translate(-50%,-50%); }
  .incense img { width: 120px; height: 108px; object-fit: contain; }
  .incense-label { position: absolute; left: 50%; top: 76%; transform: translate(-50%,-50%);
    font-size: 14px; color: rgba(253,246,227,0.75); white-space: nowrap; }
  .top-words { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .top-words .main { font-size: 18px; font-weight: bold; color: #FFD700; }
  .top-words .sub { font-size: 12px; color: #ffffff; margin-top: 4px; }
  .note { margin-top: 20px; font-size: 12.5px; color: rgba(253,246,227,0.6); max-width: 980px; line-height: 1.85; }
  code { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>祈福 · 进香阶段：财神文字与香炉重叠 → 三个方案</h1>
  <div class="sub">
    核心矛盾：五神阵（含每尊财神下方「名号/方位/寓意」文字）垂直占用太大，
    往上一顶就撞到顶部「心诚则灵」，往下一落就压到香炉三炷香。<br>
    下面 A=现状，B/C 是两种不同的化解思路，你看哪个方向对味。
  </div>

  <div class="row">
    <div class="cell">
      <div class="tag a">A · 现状（文字压香炉）</div>
      <div class="phone" id="phone-A"><div class="glow"></div><div class="deity-array" data-ph="A"></div><div class="incense"><img src="entry/src/main/resources/rawfile/props/incense_burner.png"></div><div class="incense-label">三炷香 · 敬献财神</div><div class="top-words" style="top:64px"><div class="main">✦ 心诚则灵 ✦</div><div class="sub">诚心叩拜 · 财运亨通</div></div></div>
    </div>
    <div class="cell">
      <div class="tag b">B · 精简文字 + 阵型上移</div>
      <div class="phone" id="phone-B"><div class="glow"></div><div class="deity-array" data-ph="B"></div><div class="incense"><img src="entry/src/main/resources/rawfile/props/incense_burner.png"></div><div class="incense-label">三炷香 · 敬献财神</div><div class="top-words" style="top:64px"><div class="main">✦ 心诚则灵 ✦</div><div class="sub">诚心叩拜 · 财运亨通</div></div></div>
    </div>
    <div class="cell">
      <div class="tag c">C · 保留文字，祝语上移</div>
      <div class="phone" id="phone-C"><div class="glow"></div><div class="deity-array" data-ph="C"></div><div class="incense"><img src="entry/src/main/resources/rawfile/props/incense_burner.png"></div><div class="incense-label">三炷香 · 敬献财神</div><div class="top-words" style="top:36px"><div class="main">✦ 心诚则灵 · 财运亨通 ✦</div></div></div>
    </div>
  </div>

  <div class="note" id="note">渲染中…</div>

<script>
  const DEITIES = {
    1: { name:'王亥', direction:'中路', meaning:'商祖开路，牛转乾坤，通达八方', color:'#F0C419', img:'1.png' },
    2: { name:'比干', direction:'东路', meaning:'公道无私，正财稳进，童叟无欺', color:'#D98C2B', img:'2.png' },
    3: { name:'关羽', direction:'西路', meaning:'重义守信，镇宅辟邪，合伙共赢', color:'#C0392B', img:'3.png' },
    4: { name:'柴荣', direction:'南路', meaning:'帝王之气，破局开路，做大做强', color:'#E8741E', img:'4.png' },
    5: { name:'赵公明', direction:'北路', meaning:'黑虎镇守，驱邪纳福，正财聚宝', color:'#8A5A1E', img:'5.png' },
  };
  const LAYOUT = { 1:{x:0.50,y:0.52,size:100}, 2:{x:0.22,y:0.38,size:60}, 3:{x:0.78,y:0.38,size:60}, 4:{x:0.39,y:0.12,size:52}, 5:{x:0.61,y:0.12,size:52} };
  const todayId = 5;
  function anchorOf(id){ if(id===todayId)return 1; if(id===1)return todayId; return id; }
  function hexToRgba(h,a){ const c=h.replace('#',''); return `rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`; }

  const MODE = {
    A: { top:'25%', text:'full' },
    B: { top:'12%', text:'compact' },   // 精简：去掉「寓意」两行，只留 名号+方位
    C: { top:'12%', text:'full' },      // 保留文字，但祝语上移(36px)让出顶部
  };

  function render(ph) {
    const phone = document.getElementById('phone-' + ph);
    const array = phone.querySelector('.deity-array');
    const m = MODE[ph];
    array.style.top = m.top;
    Object.keys(DEITIES).forEach(idStr => {
      const id = Number(idStr), d = DEITIES[id];
      const L = LAYOUT[anchorOf(id)]; const size = L.size;
      const hl = id === todayId;
      const el = document.createElement('div');
      el.className = 'deity';
      el.style.left = (L.x*390)+'px';
      el.style.top = (L.y * (phone.clientHeight*0.5))+'px';

      const halo = document.createElement('div');
      halo.className = 'halo';
      const hs = size*1.5;
      halo.style.cssText = `width:${hs}px;height:${hs}px;background:radial-gradient(circle,${hexToRgba(d.color, hl?0.28:0.10)} 0%,transparent 70%);`;
      el.appendChild(halo);

      const wrap = document.createElement('div');
      wrap.className = 'iconwrap';
      wrap.style.cssText = `width:${size+12}px;height:${size+12}px;`;
      const ring = document.createElement('div');
      ring.className = 'ring'; ring.style.borderColor = d.color;
      wrap.appendChild(ring);
      const img = document.createElement('img');
      img.src = 'entry/src/main/resources/rawfile/deities/'+d.img;
      img.style.cssText = `width:${size}px;height:${size}px;`;
      wrap.appendChild(img);
      el.appendChild(wrap);

      const name = document.createElement('div');
      name.className = 'name'; name.style.fontSize = (hl?18:14)+'px'; name.textContent = d.name;
      el.appendChild(name);

      const dir = document.createElement('div');
      dir.className = 'direction'; dir.textContent = '· '+d.direction+' ·';
      el.appendChild(dir);

      if (m.text === 'full') {
        const meaning = document.createElement('div');
        meaning.className = 'meaning'; meaning.style.width = (size*1.6)+'px';
        meaning.textContent = d.meaning.replace('，','\n');
        el.appendChild(meaning);
      }
      array.appendChild(el);
    });
  }
  ['A','B','C'].forEach(render);

  setTimeout(() => {
    const lines = [];
    ['A','B','C'].forEach(ph => {
      const phone = document.getElementById('phone-'+ph);
      const pr = phone.getBoundingClientRect();
      const deities = [...phone.querySelectorAll('.deity')];
      const main = deities.find(d => d.querySelector('.name').textContent === DEITIES[todayId].name);
      const topDeities = deities.filter(d => {
        const n = d.querySelector('.name').textContent;
        return n === DEITIES[1].name || n === DEITIES[4].name; // 王亥(anchor5) 柴荣(anchor4) 顶部两尊
      });
      const tw = phone.querySelector('.top-words').getBoundingClientRect();
      const inc = phone.querySelector('.incense img').getBoundingClientRect();
      const mainBottom = main.getBoundingClientRect().bottom - pr.top;
      const topMinY = Math.min(...topDeities.map(d => d.getBoundingClientRect().top - pr.top));
      const twBottom = tw.bottom - pr.top;
      const incTop = inc.top - pr.top;
      const sepTop = topMinY - twBottom;
      const sepBottom = incTop - mainBottom;
      lines.push(`${ph}：顶部神上缘 y=${topMinY.toFixed(0)} vs 祝语底 y=${twBottom.toFixed(0)} → ${sepTop>=14?'✓ 间隙 '+sepTop.toFixed(0)+'px':'⚠ 顶撞' }；主神文字底 y=${mainBottom.toFixed(0)} vs 香炉顶 y=${incTop.toFixed(0)} → ${sepBottom>=14?'✓ 间隙 '+sepBottom.toFixed(0)+'px':'⚠ 压香炉'}`);
    });
    document.getElementById('note').innerHTML =
      '📏 实测（390×844vp，进香阶段，今日主神=赵公明）：<br>　' + lines.join('<br>　') +
      '<br><br>B 方案（精简：去掉每尊财神下两行「寓意」，只留名号＋方位）改动见 <code>DeityView.ets</code>；' +
      'C 方案（保留文字）只需把顶部祝语从 y=64 上提到 y=36 并合并成单行，再把阵型顶锚 <code>position{y:\'12%\'}</code>。<br>请确认方向后我再动 ArkTS 代码。';
  }, 450);
</script>
</body>
</html>
